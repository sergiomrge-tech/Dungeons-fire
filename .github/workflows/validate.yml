name: Validate Dungeons Fires
on:
  push:
    paths:
      - '**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dungeons-fires-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dungeons-native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl --fail --location --retry 3 -o /tmp/df-godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip /tmp/df-godot.zip -d /tmp/df-godot
          echo '/tmp/df-godot' >> "$GITHUB_PATH"
      - name: Audit independent project
        run: python3 tests/audit_project.py
      - name: Import and parse
        run: |
          set -o pipefail
          Godot_v4.6.1-stable_linux.x86_64 --headless --editor --import --quit 2>&1 | tee /tmp/df-import.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/df-import.log; then exit 1; fi
      - name: Test campaign, transactions, saves and multitouch
        run: |
          set -o pipefail
          Godot_v4.6.1-stable_linux.x86_64 --headless --script tests/test_game.gd -- --qa 2>&1 | tee /tmp/df-tests.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/df-tests.log; then exit 1; fi
      - name: Test real combat without forced enemy deaths
        run: |
          set -o pipefail
          Godot_v4.6.1-stable_linux.x86_64 --headless --script tests/test_combat_bot.gd -- --qa 2>&1 | tee /tmp/df-combat.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/df-combat.log; then exit 1; fi
      - name: Test Garron with real combat
        run: |
          set -o pipefail
          Godot_v4.6.1-stable_linux.x86_64 --headless --script tests/test_combat_bot.gd -- --qa --garron 2>&1 | tee /tmp/df-garron.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/df-garron.log; then exit 1; fi
      - name: Test living hub, journal and transitions
        run: |
          set -o pipefail
          Godot_v4.6.1-stable_linux.x86_64 --headless --script tests/test_living_hub_v03.gd -- --qa 2>&1 | tee /tmp/df-hub.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/df-hub.log; then exit 1; fi
      - name: Test classic layout navigation and save values
        run: |
          set -o pipefail
          Godot_v4.6.1-stable_linux.x86_64 --headless --script tests/test_classic_ui.gd -- --qa 2>&1 | tee /tmp/df-classic-ui.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/df-classic-ui.log; then exit 1; fi
      - name: Test first-region combat, rooms, boss and reward
        run: |
          set -o pipefail
          Godot_v4.6.1-stable_linux.x86_64 --headless --script tests/test_first_region_v05.gd -- --qa 2>&1 | tee /tmp/df-region.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/df-region.log; then exit 1; fi
      - name: Pack clean independent source
        run: git archive --format=zip --prefix=Dungeons_Fires_Godot_v0_5_0/ HEAD -o /tmp/Dungeons_Fires_Godot_v0_5_0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Dungeons-Fires-Godot-source-v050
          path: /tmp/Dungeons_Fires_Godot_v0_5_0.zip
      - name: Validate authored sprite atlas and HUD
        run: |
          set -o pipefail
          Godot_v4.6.1-stable_linux.x86_64 --headless --script tests/test_visual_assets.gd -- --qa 2>&1 | tee /tmp/df-art.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/df-art.log; then exit 1; fi
      - name: Capture actual Godot framebuffer
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          command -v xvfb-run || (sudo apt-get update -qq && sudo apt-get install -y xvfb xauth)
          xvfb-run -a -s '-screen 0 1280x720x24' Godot_v4.6.1-stable_linux.x86_64 --rendering-method gl_compatibility --audio-driver Dummy --script tests/capture_visuals.gd -- --qa --capture-dir=/tmp/dungeons-fires-visuals 2>&1 | tee /tmp/df-visual.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/df-visual.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Dungeons-Fires-real-framebuffer-v050
          path: /tmp/dungeons-fires-visuals/*.png

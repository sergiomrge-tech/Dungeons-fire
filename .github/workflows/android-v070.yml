name: Build Android v0.7 preview APK
on:
  push:
    branches:
      - systems-v07
    paths:
      - '.github/workflows/android-v070.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dungeons-android-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export-android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build packages using runner SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
      - name: Install pinned Godot and Android export templates
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo '/tmp/godot' >> "$GITHUB_PATH"
          curl --fail --location --retry 3 -o /tmp/export.tpz https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz
          mkdir -p /tmp/godot-export "$HOME/.local/share/godot/export_templates/4.6.1.stable"
          unzip -q /tmp/export.tpz -d /tmp/godot-export
          cp -a /tmp/godot-export/templates/. "$HOME/.local/share/godot/export_templates/4.6.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.6.1.stable/android_debug.apk"
      - name: Create isolated debug signing key and Godot settings
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/dungeons_preview.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -storepass android -keypass android -dname "CN=Dungeons Preview, O=Local Android Tests, C=BR"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/dungeons_preview.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          python3 - <<'PY'
          from pathlib import Path
          project=Path('project.godot')
          settings=project.read_text()
          assert '[rendering]' in settings
          settings=settings.replace('[rendering]', '[rendering]\ntextures/vram_compression/import_etc2_astc=true', 1)
          project.write_text(settings)
          f=Path('export_presets.cfg')
          s=f.read_text()
          assert 'package/unique_name="com.sergiomrge.dungeonsfires"' in s
          s=s.replace('package/unique_name="com.sergiomrge.dungeonsfires"','package/unique_name="com.sergiomrge.dungeonsfires.preview.v070"')
          s=s.replace('package/name="Dungeons Fires"','package/name="Dungeons Fires Preview 0.7"')
          s=s.replace('package/signed=false','package/signed=true')
          s=s.replace('version/code=600','version/code=700')
          s=s.replace('version/name="0.6.0"','version/name="0.7.0"')
          f.write_text(s)
          PY
      - name: Import assets and validate GDScript
        run: |
          set -o pipefail
          Godot_v4.6.1-stable_linux.x86_64 --headless --editor --import --quit 2>&1 | tee /tmp/preview-import.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/preview-import.log; then exit 1; fi
      - name: Native regression gates before Android export
        run: |
          set -euo pipefail
          python3 tests/audit_project.py
          for suite in test_game test_first_region_v05 test_combat_bot test_living_hub_v03 test_classic_ui test_visual_assets test_touch_pipeline test_combat_vfx test_run_systems_v07; do
            Godot_v4.6.1-stable_linux.x86_64 --headless --script tests/$suite.gd -- --qa 2>&1 | tee /tmp/native-$suite.txt
            if grep -E 'SCRIPT ERROR|ERROR:' /tmp/native-$suite.txt; then exit 1; fi
          done
      - name: Export signed debug preview
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/preview-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          cp "$HOME/.android/dungeons_preview.keystore" "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          mkdir -p /tmp/preview
          Godot_v4.6.1-stable_linux.x86_64 --headless --export-debug Android /tmp/preview/Dungeons_Fires_v0_7_0_Android.apk
          test -s /tmp/preview/Dungeons_Fires_v0_7_0_Android.apk
      - name: Verify APK integrity and signature
        run: |
          set -euo pipefail
          APK=/tmp/preview/Dungeons_Fires_v0_7_0_Android.apk
          unzip -t "$APK" | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 -v 4 "$APK" > /tmp/preview-alignment.txt
          tail -n 1 /tmp/preview-alignment.txt
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" > /tmp/preview-badging.txt
          sed -n '1,3p' /tmp/preview-badging.txt
          grep -F "com.sergiomrge.dungeonsfires.preview.v070" /tmp/preview-badging.txt
          grep -F "versionName='0.7.0'" /tmp/preview-badging.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk=Path('/tmp/preview/Dungeons_Fires_v0_7_0_Android.apk')
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              assert z.testzip() is None
              assert 'assets/scripts/classic_ui.gdc' in names, 'Classic UI must be exported'
              assert 'assets/scripts/boss_patterns.gdc' in names
              assert 'assets/scripts/combat_vfx.gdc' in names
              assert 'assets/data/mine_rooms.json' in names
              assert 'assets/data/boons.json' in names
              assert 'assets/data/mobs.json' in names
              assert not any('android_driver' in n for n in names)
              assert any('hub_camp.webp-' in n for n in names), 'Forest camp background must be exported'
              assert not any(n.startswith(('assets/tests/','assets/art_sources/','assets/tools/','assets/builds/')) for n in names), 'Exclude internal sources from APK'
              assert not any(n.endswith(('.keystore','.jks')) for n in names), 'No signing key in APK'
          print('APK_CONTENT: classic UI and forest camp verified; internal tooling excluded')
          PY
          sha256sum "$APK" | tee /tmp/preview/sha256.txt
          echo "Preview uses an isolated ephemeral debug certificate and distinct Android application ID. It can coexist with the signed v0.1.0. Keys are never committed." > /tmp/preview/README.txt
      - name: Export isolated x86_64 Android runtime test
        run: |
          set -euo pipefail
          cp tests/android_driver.gd scripts/android_driver.gd
          python3 - <<'PYQA'
          from pathlib import Path
          p=Path('scripts/game.gd');s=p.read_text();s=s.replace('\tshow_menu()\n','\tshow_menu()\n\tadd_child(load("res://scripts/android_driver.gd").new())\n',1);p.write_text(s)
          p=Path('export_presets.cfg');s=p.read_text().replace('preview.v070','qa.v070').replace('architectures/arm64-v8a=true','architectures/arm64-v8a=false').replace('architectures/x86_64=false','architectures/x86_64=true');p.write_text(s)
          p=Path('tests/run_android_qa.py');p.write_text(p.read_text().replace('qa.v060','qa.v070'))
          PYQA
          Godot_v4.6.1-stable_linux.x86_64 --headless --editor --import --quit
          Godot_v4.6.1-stable_linux.x86_64 --headless --export-debug Android /tmp/android-qa.apk
      - name: Enable KVM for actual Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android API 29 runtime, multitouch and lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          ram-size: 2048M
          disk-size: 4096M
          emulator-options: -skin 1280x720 -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 tests/run_android_qa.py
      - name: Retain Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dungeons-Fires-Android-runtime-v070
          path: /tmp/android-runtime/*
          if-no-files-found: warn
      - name: Upload Android APK preview
        uses: actions/upload-artifact@v4
        with:
          name: Dungeons-Fires-Android-v070-preview
          path: /tmp/preview/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish installable Android v0.7 preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/preview
          sha256sum -c sha256.txt
          cat > /tmp/dungeons-release-notes.txt <<'NOTES'
          Dungeons Fires: As Cinco Brasas v0.7.0 — prévia Android ARM64.

          Inclui os novos sistemas de expedição: oito bênçãos temporárias, rotas de santuário ou risco, sinergias entre heróis, projetos permanentes para o acampamento, contratos opcionais e cinco tipos inéditos de inimigos. Preserva o acampamento visual aprovado, o layout clássico e os efeitos iluminados de combate da v0.6.

          APK debug assinado para instalação de teste, com identificador independente com.sergiomrge.dungeonsfires.preview.v070. A atualização não substitui instalações anteriores; o progresso de outras prévias não é migrado automaticamente.

          Projeto importado e validado em Godot 4.6.1. Verificação de integridade do APK, assinatura e alinhamento realizada no build. A automação executa também QA em emulador Android API 29 com simulação de toque, pausa e retomada. Não substitui teste de desempenho em aparelho físico.
          NOTES
          gh release create v0.7.0-preview Dungeons_Fires_v0_7_0_Android.apk sha256.txt README.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Dungeons Fires v0.7.0 — Novos sistemas e inimigos" \
            --notes-file /tmp/dungeons-release-notes.txt --prerelease --latest=false
